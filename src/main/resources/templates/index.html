<!DOCTYPE html>
<html lang="en" xmlns:th="https://thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITULO AQUI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
<body>
  
  <section>
    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container-fluid px-5">
        <a class="navbar-brand text-white" th:href="@{/}">Drilling M6</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-white" th:href="@{/}">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" th:href="@{/alumnos}">Alumnos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" th:href="@{/login}">Iniciar sesión</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </section>

    <section class="container mt-5 d-flex flex-column gap-5">
      <h1>Universidad: Listado de alumnos y sus materias</h1>
      <div style="max-height: 600px; overflow-y: scroll;">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>RUT</th>
              <th>Nombre</th>
              <th>Direccion</th>
              <th>Materias</th>
              <th>Acciones</th>
            </tr>
          </thead>
            <tbody>
              <tr th:each="alumno : ${alumnos}">
                <td th:text="${alumno.rut}">NO PRESENTA</td>
                <td th:text="${alumno.nombre}">NO PRESENTA</td>
                <td th:text="${alumno.direccion}">NO PRESENTA</td>
                <td>
                  <div class="d-flex flex-wrap gap-1" style="max-width: 300px;">
                    <span th:each="materia : ${alumno.materiaList}">
                      <span class="badge rounded-pill p-2" th:text="${materia.nombre}" style="background-color: rgb(68, 0, 255);"></span>
                    </span>
                  </div>
                </td>
                <td>
                  <button type="button" class="btn btn-warning fw-bold btn-sm rounded">Editar</button>
                </td>
              </tr>
            </tbody>
        </table>
      </div>
      <div>
        <a th:href="@{/alumnos/nuevo}">
          <button class="btn btn-primary" type="button"><i class="fa fa-plus"></i> <span>Nuevo socio</span></button>
        </a>
      </div>
    </section>

  <!-- COMPONENTE DE AVISOS -->
  <div th:if="${mensaje != null && tipo != null}" th:class="'me-4 mb-4 alert alert-dismissible ' + 'alert-' + ${tipo}" role="alert" style="position: absolute; bottom: 0; right: 0; min-width: 400px;">
    <div th:text="${mensaje}"></div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <!-- COMPONENTE DE AVISOS -->

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/app.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
